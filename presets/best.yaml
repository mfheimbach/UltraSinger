# Best configuration as of 2026-11-25 (bench 0.736 / full songs 0.771 with the CPU proxy).
name: best
steps:
  - use: separate
    params: {model: htdemucs_ft}
  - use: prepare
  - use: tempo
  - use: key
  - use: transcribe.whisper
    params: {model: large-v3-turbo, batch_size: 4}
  - use: lyrics.lrclib
  - use: words.correct_lyrics
  - use: words.strip_punctuation
  - use: syllables.hyphenate
  - use: syllables.silence_split
  - use: pitch.rmvpe
  - use: segment.game
  - use: notes.from_pitch
  - use: notes.game_pitch
  - use: notes.merge
  - use: notes.snap_edges
  - use: notes.calibrate
  - use: notes.line_breaks
  - use: write.ultrastar
