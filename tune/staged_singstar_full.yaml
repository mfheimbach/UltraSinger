# Staged tuning for the SingStar chart style, early stages first: each group is tuned with
# everything upstream fixed at the result so far, and kept only if its cross-validated gain beats
# max(min_gain, noise_sigma x noise SD of the module it re-rolls); search steps count from
# step_sigma x noise SD. Every tunable parameter of the pipeline is in a group (format-only ones:
# write.conventions rules; fallbacks that rarely act: the effect probe drops them when they change
# nothing). Expensive groups (before GAME) use value lists, cheap groups (note stages, line breaks,
# writer) are searched jointly with TPE.
name: staged_singstar_full
base: best          # full songs; lyrics lookup is an optional module (off in best)
overrides: []
data:
  train: eval_singstar/tune_train       # full songs of ~75% of the train artists (make_tuning_sets.py)
  holdout: eval_singstar/tune_holdout   # the other ~25%, artist-disjoint; scored once at the end
  folds: 3
  gt_language: true
objective:          # per song: weighted sum x (floor + (1 - floor) x factor), mean over songs
  sum: {usdx_medium_f1: 1.0, usdx_hard: 0.5, start_score: 0.5, end_score: 0.25, line_f1: 0.25}
  multiply: {lyrics_acc: 0.5}   # wrong words halve a chart's value; failed transcriptions still count (logged)
# noise levels per engine come from tune/noise.yaml (see there)
noise_sigma: 1.0    # adoption: ~1 noise SD
step_sigma: 0.25    # search steps (patience, coordinate moves): a quarter SD
min_gain: 0.001     # absolute floor (scale of the objective)
fold_gate: true     # inside CV folds, leave the base only for gains beyond the threshold too
effect_probe: true  # drop dimensions that change no chart (masked by a later step)
workers: auto       # parallel song tails for cheap groups (CPU cores - 2, at most 8); 1 = off
sampler: auto       # grid when everything is discrete and fits the budget, else TPE
trials: 50          # per group unless the group sets its own
stop: {patience: 20}   # search ends at trials, or no gain > min gain for 30 trials, whichever first
coordinate_points: 7   # values per continuous dimension for coordinate descent
cost: {cheap_seconds: 3.0, unknown_seconds: 1.0}   # rerun cost per 30 s audio that counts as cheap
stages:
  # --- audio
  - name: separation model
    search:
      separate.model: [htdemucs_ft, htdemucs]
  - name: vocal preparation switches
    search:
      prepare.denoise: [true, false]
      prepare.mute_silence: [true, false]
  - name: denoise strength          # dropped by the effect probe if denoise was switched off
    search:
      prepare.denoise_reduction_db: [40, 70, 97]
      prepare.denoise_floor_db: [-80, -60]
  - name: silence muting level
    search:
      prepare.silence_threshold_db: [-60, -50, -40]
      prepare.min_silence_ms: [25, 50, 100]
  # --- words (one Whisper pass per value: sequential groups instead of one grid)
  - name: whisper precision
    search:
      transcribe.whisper.compute_type: [int8, float32]
  - name: whisper batch size
    search:
      transcribe.whisper.batch_size: [4, 16]
  - name: numbers as words
    search:
      transcribe.whisper.keep_numbers: [false, true]
  - name: untimed words (fallback)
    search:
      words.place_untimed.gap: [0.05, 0.1, 0.2]
      words.place_untimed.length: [0.05, 0.1, 0.2]
  # --- syllables
  - name: hyphenation
    search:
      syllables.hyphenate.enabled:
        true:
          syllables.hyphenate.backend: [pyhyphen, pyphen]
        false: {}
  - name: silence split
    search:
      syllables.silence_split.silence_threshold_db: [-60, -50, -40]
      syllables.silence_split.min_silence_ms: [25, 50, 100]
      syllables.silence_split.min_piece: [0.05, 0.1, 0.2]
  # --- pitch and segmentation
  - name: pitch track
    search:
      pitch.rmvpe.decode_threshold: [0.01, 0.03, 0.06, 0.1]
  - name: segmentation module
    search:
      segment.game.use:
        segment.game: {}
        segment.contour:
          notes.game_pitch.enabled: [false]   # contour has no GAME pitches
  - name: GAME thresholds
    search:
      segment.game.boundary_threshold: [0.1, 0.15, 0.2, 0.3]
      segment.game.presence_threshold: [0.1, 0.2, 0.3]
  - name: GAME decoding
    search:
      segment.game.radius: [1, 2, 3]
      segment.game.steps: [4, 8, 16]
      segment.game.chunk_seconds: [15.0, 30.0]
  # --- notes (cheap: joint search)
  - name: key analysis
    search:
      key.analysis_seconds: [10.0, 20.0, 60.0]
  - name: notes
    trials: 80
    search:
      notes.from_pitch.method: [chroma_mode, median, mode]
      notes.from_pitch.conf_threshold: {low: 0.1, high: 0.7}
      notes.from_pitch.edge_trim: {low: 0.0, high: 0.3}
      notes.from_pitch.tuning_correction:
        true:
          notes.from_pitch.tuning_min_frames: {low: 5, high: 50}
        false: {}
      notes.from_pitch.fmin: {low: 0.0, high: 100.0}
      notes.from_pitch.fmax: {low: 800.0, high: 20000.0, log: true}
      notes.quantize_key.enabled:
        true:
          notes.quantize_key.min_offset: {low: 0.0, high: 0.5}
        false: {}
      notes.merge.slides:
        false: {}
        true:
          notes.merge.slide_max_semitones: {low: 1, high: 3}
          notes.merge.slide_max_sixteenths: {low: 1.0, high: 4.0}
      notes.merge.breath_pause_sixteenths: {low: 0.5, high: 3.0}
      notes.merge.same_pitch_syllables: [true, false]
      notes.snap_edges.max_shift: {low: 0.0, high: 0.8}
      notes.snap_edges.conf: {low: 0.0, high: 0.4}
      notes.snap_edges.min_gap: {low: 0.0, high: 0.08}
      notes.snap_edges.min_len: {low: 0.02, high: 0.12}
      notes.calibrate.offset: {low: -0.2, high: 0.1}
      notes.calibrate.end_extension: {low: -0.1, high: 0.3}
      notes.calibrate.min_len: {low: 0.0, high: 0.1}
  - name: line breaks
    trials: 60
    search:
      notes.line_breaks.intercept: {low: 0.0, high: 3.0}
      notes.line_breaks.w_pause: {low: 0.2, high: 1.5}
      notes.line_breaks.w_punct: {low: 0.0, high: 1.0}
      notes.line_breaks.chars_mean: {low: 15.0, high: 30.0}
      notes.line_breaks.chars_sd: {low: 5.0, high: 15.0}
      notes.line_breaks.chars_max: [38, 45, 60]
      notes.line_breaks.dur_median: {low: 1.2, high: 3.0}
      notes.line_breaks.dur_log_sd: {low: 0.3, high: 1.0}
      notes.line_breaks.prior_weight: {low: 0.2, high: 2.0}
      notes.line_breaks.max_words: [12, 16, 24]
      notes.line_breaks.pause_floor: {low: 0.005, high: 0.1, log: true}
      notes.line_breaks.prob_floor: {low: 0.0001, high: 0.01, log: true}
      notes.line_breaks.dur_floor: {low: 0.02, high: 0.2}
  - name: punctuation model windows
    search:
      notes.line_breaks.punct_chunk: [100, 150, 250]
      notes.line_breaks.punct_context: [15, 30, 60]
  # --- chart
  - name: beat grid
    search:
      write.ultrastar.max_bpm: [200.0, 400.0, 800.0]
