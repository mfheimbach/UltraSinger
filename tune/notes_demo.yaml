# Demo / smoke test: the note-level parameters on the quick bench (cheap: seconds per trial).
name: notes_demo
base: bench
data:
  train: eval_singstar/bench
  holdout: eval_singstar/selection
  folds: 3
  gt_language: true
objective:          # per song: weighted sum x factors (lyrics gate: wrong words break a chart), mean over songs
  sum: {usdx_medium_f1: 1.0, usdx_hard: 0.5, start_score: 0.5, end_score: 0.25, line_f1: 0.25}
  multiply: [lyrics_acc]
min_gain: 0.001
noise_sigma: 1.0
step_sigma: 0.25
fold_gate: true
effect_probe: true   # drop dimensions that change no chart (masked by a later step)
sampler: auto
stop: {patience: 30}
coordinate_points: 7
cost: {cheap_seconds: 3.0, unknown_seconds: 1.0}
search:
  notes.calibrate.offset: {low: -0.15, high: 0.0}
  notes.calibrate.end_extension: {low: 0.0, high: 0.15}
  notes.snap_edges.max_shift: {low: 0.0, high: 0.8}
  notes.snap_edges.conf: {low: 0.02, high: 0.4}
  notes.quantize_key.min_offset: {low: 0.0, high: 0.5}
  notes.merge.same_pitch_syllables: [true, false]
trials: 30
